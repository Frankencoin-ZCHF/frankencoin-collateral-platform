name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Fail on every reported vulnerability and on audit/registry errors.
      - name: Dependency security audit
        run: yarn audit
      - run: yarn run check
      - run: yarn test
      - run: yarn build
      - name: Smoke-test the production server
        run: |
          PORT=3999 node ./dist/server/entry.mjs & sleep 4
          curl -sf http://127.0.0.1:3999/health > /dev/null
          curl -sf -o /dev/null http://127.0.0.1:3999/
